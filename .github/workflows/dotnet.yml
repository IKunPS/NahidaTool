name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        platform: [x64, x86]
      fail-fast: false   # 一个平台失败不影响其他平台

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 初始化 MSVC 环境
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.platform }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 还原依赖
      - name: Restore dependencies
        run: dotnet restore src/NahidaTool/NahidaTool.csproj -p:Platform=${{ matrix.platform }}

      # 构建 C# 主程序
      - name: Build NahidaTool (C#)
        run: >
          dotnet build src/NahidaTool/NahidaTool.csproj
          -p:Platform=${{ matrix.platform }}
          -c Release
          --no-restore

      # 构建 C++ 启动器
      - name: Build Launcher (C++)
        run: >
          msbuild src/NahidaTool.Launcher/NahidaTool.Launcher.vcxproj
          /p:Configuration=Release
          /p:Platform=${{ matrix.platform }}
          /p:PlatformToolset=v143
          /p:PostBuildEventUseInBuild=false
          /p:OutDir=${{ github.workspace }}\bin\

      # 上传构建产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NahidaTool-${{ matrix.platform }}
          path: bin/** 
